name: DEM CI/CD and Debian 13 Validation Pipeline

on:
  push:
    branches: [ main, master, 'feature/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  static-checks:
    name: Static Code & Repository Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run Repository Static Validation
        run: |
          ./dem.sh validate

  debian-13-runtime-validation:
    name: Debian 13 Runtime Validation & Profiling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Systemd-Enabled Debian 13 (Trixie) Container
        run: |
          # Pull official trixie image
          docker pull debian:trixie-slim

          # Build custom systemd and ping-enabled image
          cat <<'EOF' > Dockerfile
          FROM debian:trixie-slim
          RUN apt-get update && apt-get install -y systemd systemd-sysv iputils-ping git lsof && apt-get clean
          EOF
          docker build -t debian13-systemd .

          # Start privileged container with real systemd and cgroups v2 write access
          docker run --tmpfs /tmp --tmpfs /run --tmpfs /run/lock \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            --cgroupns=host \
            --privileged -d \
            --name debian13-runtime \
            debian13-systemd \
            /lib/systemd/systemd

          # Wait for systemd to initialize
          sleep 5
          docker ps

      - name: Verify Environment and Os-Release
        run: |
          docker exec -t debian13-runtime cat /etc/os-release
          # Confirm ID is debian and VERSION_CODENAME is trixie
          docker exec -t debian13-runtime bash -c "source /etc/os-release && [ \"\$ID\" = \"debian\" ] && [ \"\$VERSION_CODENAME\" = \"trixie\" ]"

      - name: Copy DEM Workspace into Container
        run: |
          docker exec -t debian13-runtime mkdir -p /app
          docker cp . debian13-runtime:/app
          docker exec -w /app -t debian13-runtime chmod -R +x dem.sh bootstrap.sh commands/

      - name: Execute Bootstrap
        run: |
          docker exec -w /app -t debian13-runtime ./bootstrap.sh

      - name: Test Network Failure Safety Under Complete Network Isolation
        run: |
          echo "==== DISCONNECT CONTAINER NETWORK ===="
          docker network disconnect bridge debian13-runtime

          echo "==== ATTEMPT INSTALL UNDER ISOLATION ===="
          # The install command must exit non-zero and fail cleanly
          if docker exec -w /app -t debian13-runtime ./dem.sh install minimal; then
              echo "CRITICAL ERROR: DEM install silently succeeded or didn't exit non-zero under complete network isolation!"
              exit 1
          else
              echo "CONFIRMED: DEM install failed safely with non-zero status as expected."
          fi

          echo "==== RECONNECT CONTAINER NETWORK ===="
          docker network connect bridge debian13-runtime

          # Verify connection is restored
          sleep 2
          docker exec -w /app -t debian13-runtime ping -c 1 -W 5 1.1.1.1

      - name: Run Pre-Flight Diagnostics (Doctor & Validate)
        run: |
          docker exec -w /app -t debian13-runtime ./dem.sh doctor
          docker exec -w /app -t debian13-runtime ./dem.sh validate

      - name: Run Profile Lifecycle - Minimal Profile
        env:
          DEM_ALLOW_UNSUPPORTED_SCYLLA: "true"
        run: |
          echo "==== INSTALL MINIMAL ===="
          docker exec -e DEM_ALLOW_UNSUPPORTED_SCYLLA=true -w /app -t debian13-runtime ./dem.sh install minimal

          echo "==== VERIFY MINIMAL ===="
          docker exec -w /app -t debian13-runtime ./dem.sh verify minimal

          echo "==== DOCTOR MINIMAL ===="
          docker exec -w /app -t debian13-runtime ./dem.sh doctor

          echo "==== VALIDATE MINIMAL ===="
          docker exec -w /app -t debian13-runtime ./dem.sh validate

          echo "==== IDEMPOTENCY (INSTALL MINIMAL AGAIN) ===="
          docker exec -e DEM_ALLOW_UNSUPPORTED_SCYLLA=true -w /app -t debian13-runtime ./dem.sh install minimal

          echo "==== VERIFY AGAIN ===="
          docker exec -w /app -t debian13-runtime ./dem.sh verify minimal

          echo "==== UNINSTALL MINIMAL ===="
          docker exec -w /app -t debian13-runtime ./dem.sh uninstall minimal

          echo "==== REINSTALL MINIMAL ===="
          docker exec -e DEM_ALLOW_UNSUPPORTED_SCYLLA=true -w /app -t debian13-runtime ./dem.sh install minimal

          echo "==== VERIFY FINAL ===="
          docker exec -w /app -t debian13-runtime ./dem.sh verify minimal

      - name: Run Profile Lifecycle - Server Profile
        env:
          DEM_ALLOW_UNSUPPORTED_SCYLLA: "true"
        run: |
          echo "==== INSTALL SERVER ===="
          docker exec -e DEM_ALLOW_UNSUPPORTED_SCYLLA=true -w /app -t debian13-runtime ./dem.sh install server

          echo "==== VERIFY SERVER ===="
          docker exec -w /app -t debian13-runtime ./dem.sh verify server

          echo "==== DOCTOR SERVER ===="
          docker exec -w /app -t debian13-runtime ./dem.sh doctor

          echo "==== VALIDATE SERVER ===="
          docker exec -w /app -t debian13-runtime ./dem.sh validate

          echo "==== IDEMPOTENCY (INSTALL SERVER AGAIN) ===="
          docker exec -e DEM_ALLOW_UNSUPPORTED_SCYLLA=true -w /app -t debian13-runtime ./dem.sh install server

          echo "==== VERIFY AGAIN ===="
          docker exec -w /app -t debian13-runtime ./dem.sh verify server

          echo "==== UNINSTALL SERVER ===="
          docker exec -w /app -t debian13-runtime ./dem.sh uninstall server

          echo "==== REINSTALL SERVER ===="
          docker exec -e DEM_ALLOW_UNSUPPORTED_SCYLLA=true -w /app -t debian13-runtime ./dem.sh install server

          echo "==== VERIFY FINAL ===="
          docker exec -w /app -t debian13-runtime ./dem.sh verify server

      - name: Collect Diagnostics on Failure
        if: failure()
        run: |
          echo "==== RUNTIME ENVIRONMENT DOCTOR OUTPUT ===="
          docker exec -w /app -t debian13-runtime ./dem.sh doctor || true
          echo "==== SYSTEMD JOURNAL OUTPUT ===="
          docker exec -w /app -t debian13-runtime journalctl -n 100 --no-pager || true
          echo "==== SYSTEMD SERVICE STATES ===="
          docker exec -w /app -t debian13-runtime systemctl list-units --type=service --all || true
          echo "==== APT CONFIGURATION ===="
          docker exec -w /app -t debian13-runtime apt-config dump || true
          docker exec -w /app -t debian13-runtime ls -la /etc/apt/sources.list.d/ || true

  release-gate:
    name: Final Release Gate
    runs-on: ubuntu-latest
    needs: [ static-checks, debian-13-runtime-validation ]
    steps:
      - name: Gate Check
        run: |
          echo "All static integrity checks and Debian 13 runtime profiling passed successfully."
          echo "DEM v1.0.0 is declared ready for production on Debian 13."
